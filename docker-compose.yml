version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://test:test@db:5432/test

  db:
    image: postgres:15
    container_name: fooddb_postgres
    restart: always
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]

  import:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    command: ["python", "-m", "scripts.import_openfoodfacts"]


volumes:
  postgres_data:
